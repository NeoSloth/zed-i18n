# Optional release-only distribution overlay.
# Normal `zed-i18n apply` builds do not read this file unless a build script
# explicitly passes it with `--distribution-config`.

# アプリ名と Bundle ID は本家 Zed と同じにする（ローカル運用の差し替えが素直になるため）。
# product_slug はリリース生成物と About 表示のビルド識別に残るので zed-i18n のまま維持する。
